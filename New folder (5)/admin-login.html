<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Library</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                    linear-gradient(
                            90deg,
                            rgba(38, 18, 7, .82),
                            rgba(38, 18, 7, .42)
                    ),
                    url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=2000&q=90")
                    center / cover fixed;

            color: #fff;
        }

        .page {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 50px 8%;
        }

        .intro {
            max-width: 440px;

            animation: slideLeft .8s ease;
        }

        .small {
            color: #e0a54b;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 14px;

            letter-spacing: 4px;

            margin-bottom: 15px;
        }

        .intro h1 {
            font-size: 55px;

            line-height: 1;

            color: #fff1d2;

            margin-bottom: 22px;
        }

        .intro p {
            color: #dfccb0;

            font-family: "Segoe UI", Arial, sans-serif;

            line-height: 1.7;

            font-size: 15px;
        }

        .book-stack {
            margin-top: 35px;

            display: flex;

            flex-direction: column;

            gap: 6px;
        }

        .book {
            height: 17px;

            border-radius: 3px;

            box-shadow: 0 5px 12px rgba(0,0,0,.5);
        }

        .book:nth-child(1) {
            width: 210px;
            background: #6c381b;
        }

        .book:nth-child(2) {
            width: 180px;
            background: #244b3b;
        }

        .book:nth-child(3) {
            width: 230px;
            background: #8b5429;
        }

        .login-card {
            width: 430px;

            padding: 42px;

            background:
                    linear-gradient(
                            145deg,
                            #fff5dd,
                            #ead5ad
                    );

            color: #402510;

            border-radius: 14px;

            border: 4px solid rgba(96, 54, 20, .55);

            box-shadow:
                    0 25px 70px rgba(0,0,0,.55);

            position: relative;

            animation: slideRight .8s ease;
        }

        .login-card::before {
            content: "";

            position: absolute;

            inset: 10px;

            border: 1px solid rgba(95, 57, 25, .30);

            border-radius: 8px;

            pointer-events: none;
        }

        .card-content {
            position: relative;
            z-index: 2;
        }

        .icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #e4c99b;

            border-radius: 50%;

            font-size: 38px;
        }

        .login-card h2 {
            text-align: center;

            font-size: 32px;

            color: #5d2d10;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #80664a;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 13px;

            margin-bottom: 28px;
        }

        .error-message {
            padding: 11px;

            margin-bottom: 18px;

            border-radius: 7px;

            background: #f7d6d1;

            border: 1px solid #d89b91;

            color: #8d281b;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 13px;

            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #57351f;

            font-family: "Segoe UI", Arial, sans-serif;

            font-weight: 600;

            font-size: 13px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #c7aa7b;

            border-radius: 8px;

            background: rgba(255,255,255,.62);

            color: #392313;

            outline: none;

            font-size: 14px;

            font-family: "Segoe UI", Arial, sans-serif;

            transition: .25s;
        }

        input:focus {
            border-color: #8b4b18;

            box-shadow:
                    0 0 0 3px rgba(139,75,24,.12);

            background: white;
        }

        .login-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 8px;

            background: #73370e;

            color: white;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition: .3s;
        }

        .login-button:hover {
            background: #572609;

            transform: translateY(-2px);
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #6d5035;

            text-decoration: none;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 13px;
        }

        .back:hover {
            color: #8b4b18;
        }

        .security {
            text-align: center;

            margin-top: 18px;

            color: #927c61;

            font-family: "Segoe UI", Arial, sans-serif;

            font-size: 11px;
        }

        @keyframes slideLeft {

            from {
                opacity: 0;
                transform: translateX(-40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        @keyframes slideRight {

            from {
                opacity: 0;
                transform: translateX(40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        @media(max-width:850px) {

            .page {
                justify-content: center;

                padding: 30px 20px;
            }

            .intro {
                display: none;
            }

            .login-card {
                width: 100%;
                max-width: 430px;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <div class="intro">

        <div class="small">
            ADMIN PANEL
        </div>

        <h1>
            Manage.<br>
            Control.<br>
            Build Better.
        </h1>

        <p>
            Your administrative access gives you
            the power to manage books, students,
            staff and library operations.
        </p>

        <div class="book-stack">

            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>

        </div>

    </div>

    <div class="login-card">

        <div class="card-content">

            <div class="icon">
                👨‍💼
            </div>

            <h2>Admin Login</h2>

            <p class="subtitle">
                Sign in to access the admin panel
            </p>

            <div th:if="${error}"
                 class="error-message">

                <span th:text="${error}">
                    Invalid username or password.
                </span>

            </div>

            <form th:action="@{/admin-login}"
                  method="post">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Enter username"
                           autocomplete="username"
                           required>

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Enter password"
                           autocomplete="current-password"
                           required>

                </div>

                <button type="submit"
                        class="login-button">

                    Login to Admin Panel →

                </button>

            </form>

            <a href="/login"
               class="back">

                ← Back to Login Selection

            </a>

            <div class="security">
                🔒 Authorized administrators only
            </div>

        </div>

    </div>

</div>

</body>

</html>
