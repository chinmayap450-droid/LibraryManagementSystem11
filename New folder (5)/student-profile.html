<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - Chinmaya's Library</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            background:
                    linear-gradient(
                            rgba(38, 20, 8, 0.58),
                            rgba(38, 20, 8, 0.58)
                    ),
                    url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=2000&q=85")
                    center center / cover fixed no-repeat;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #3f2918;
        }

        .profile-container {

            width: 92%;
            max-width: 900px;

            margin: 0 auto;

            padding: 35px 0 60px;
        }

        /* HEADER */

        .library-header {

            background:
                    linear-gradient(
                            135deg,
                            rgba(77,45,20,0.97),
                            rgba(111,70,30,0.97)
                    );

            border: 1px solid #d4ad68;
            border-radius: 18px;

            padding: 22px 28px;

            margin-bottom: 30px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            box-shadow:
                    0 10px 30px rgba(0,0,0,0.35),
                    inset 0 1px rgba(255,255,255,0.15);
        }

        .brand {

            color: #ffe7ad;

            font-family: Georgia, serif;

            font-size: 28px;

            font-weight: bold;
        }

        .logout-button {

            text-decoration: none;

            color: white;

            background: #9a2f24;

            padding: 10px 18px;

            border-radius: 8px;

            font-weight: bold;

            transition: 0.3s;
        }

        .logout-button:hover {

            background: #7d2019;

            transform: translateY(-2px);
        }

        /* BACK */

        .back-button {

            display: inline-block;

            margin-bottom: 25px;

            padding: 12px 20px;

            background:
                    linear-gradient(
                            135deg,
                            #75471d,
                            #9b682d
                    );

            color: #fff8e7;

            text-decoration: none;

            border-radius: 9px;

            border: 1px solid #d2a65d;

            font-weight: bold;

            box-shadow:
                    0 5px 12px rgba(0,0,0,0.25);

            transition: 0.3s;
        }

        .back-button:hover {

            transform: translateY(-2px);

            background:
                    linear-gradient(
                            135deg,
                            #5e3717,
                            #835521
                    );
        }

        /* PROFILE BOX */

        .profile-box {

            background:
                    linear-gradient(
                            rgba(255,248,231,0.97),
                            rgba(242,225,193,0.97)
                    );

            border: 1px solid #c49a5a;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                    0 15px 35px rgba(0,0,0,0.3);
        }

        .profile-title {

            text-align: center;

            margin-bottom: 35px;
        }

        .profile-title .icon {

            font-size: 65px;

            width: 95px;
            height: 95px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            border-radius: 50%;

            background:
                    linear-gradient(
                            135deg,
                            #6c431d,
                            #a87535
                    );

            box-shadow:
                    0 8px 18px rgba(0,0,0,0.25);
        }

        .profile-title h1 {

            margin: 0 0 8px;

            font-family: Georgia, serif;

            color: #5a3516;

            font-size: 36px;
        }

        .profile-title p {

            margin: 0;

            color: #755331;
        }

        /* ROWS */

        .profile-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 19px 10px;

            border-bottom:
                    1px solid #d5bb91;
        }

        .profile-row:last-child {

            border-bottom: none;
        }

        .profile-label {

            font-weight: bold;

            color: #5a3516;
        }

        .profile-value {

            color: #4d3926;

            text-align: right;

            font-weight: 500;
        }

        /* FOOTER */

        .library-footer {

            text-align: center;

            margin-top: 35px;

            color: #f4dfb2;

            font-size: 13px;
        }

        /* ANIMATION */

        .profile-box,
        .library-header {

            animation:
                    fadeUp 0.6s ease;
        }

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                        translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                        translateY(0);
            }
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .profile-container {

                width: 94%;
            }

            .library-header {

                flex-direction: column;

                gap: 15px;

                text-align: center;
            }

            .brand {

                font-size: 23px;
            }

            .profile-box {

                padding: 25px 20px;
            }

            .profile-title h1 {

                font-size: 30px;
            }

            .profile-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 6px;
            }

            .profile-value {

                text-align: left;
            }
        }

    </style>

</head>

<body>

<div class="profile-container">


    <div class="library-header">

        <div class="brand">
            📚 Chinmaya's Library
        </div>

        <a th:href="@{/logout}"
           class="logout-button">

            🚪 Logout

        </a>

    </div>


    <a th:href="@{/student-dashboard}"
       class="back-button">

        ← Back to Dashboard

    </a>


    <div class="profile-box">


        <div class="profile-title">

            <div class="icon">
                👤
            </div>

            <h1>
                My Profile
            </h1>

            <p>
                Your registered library information
            </p>

        </div>


        <div class="profile-row">

            <span class="profile-label">
                Student ID
            </span>

            <span class="profile-value"
                  th:text="${student['student_id']}">

                -

            </span>

        </div>


        <div class="profile-row">

            <span class="profile-label">
                Name
            </span>

            <span class="profile-value"
                  th:text="${student['name']}">

                -

            </span>

        </div>


        <div class="profile-row">

            <span class="profile-label">
                Email
            </span>

            <span class="profile-value"
                  th:text="${student['email']}">

                -

            </span>

        </div>


        <div class="profile-row">

            <span class="profile-label">
                Phone
            </span>

            <span class="profile-value"
                  th:text="${student['phone']}">

                -

            </span>

        </div>


        <div class="profile-row"
             th:if="${student['created_at'] != null}">

            <span class="profile-label">
                Registered On
            </span>

            <span class="profile-value"
                  th:text="${student['created_at']}">

                -

            </span>

        </div>


    </div>


    <div class="library-footer">

        © 2026 Chinmaya's Library · Student Portal · Knowledge lives here

    </div>


</div>

</body>

</html>
